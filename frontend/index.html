<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarbonPredict</title>
</head>
<body>
    <div>
        <h1>CarbonPredict</h1>
        <p>Welcome to CarbonPredict!</p>
        <h2>Pore Characteristics</h2>
        <label for="inputField">Enter Specific Surface Area (m²/g):</label>
        <input type="text" id="inputField" placeholder="(m²/g)">
        <label for="inputField2">Enter Pore Volume (cm³/g):</label>
        <input type="text" id="inputField2" placeholder="(cm³/g)">
        <label for="inputField3">Enter Pore size (nm):</label>
        <input type="text" id="inputField3" placeholder="(nm)">
        <h2>Material Properties</h2>
        <label for="inputField4">Enter Particle Size (nm):</label>
        <input type="text" id="inputField4" placeholder="(nm)">
        <label for="inputField5">Enter Morphology (g/cm³):</label>
        <input type="text" id="inputField5" placeholder="(g/cm³)">  
        <label for="inputField6">Enter Dopant/Modifier :</label>
        <input type="text" id="inputField6" placeholder="">
        <h2>Experimental Conditions</h2>
        <label for="inputField7">Enter Temperature (°C):</label>
        <input type="text" id="inputField7" placeholder="(°C)">
        <label for="inputField8">Enter Pressure (atm):</label>
        <input type="text" id="inputField8" placeholder="atm">
        <label for="inputField9">Enter Time (h):</label>
        <input type="text" id="inputField9" placeholder="h">

    </div>
</body>
</html>
