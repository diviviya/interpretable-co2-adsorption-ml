<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account access | CarbonLab</title><link rel="stylesheet" href="css/style.css?v=carbonlab-final-20261103">
</head>
<body class="auth-body">
  <main class="auth-layout">
    <a class="auth-brand" href="index.html"><span class="brand-symbol">C₂</span><span>CarbonLab</span></a>
    <section class="auth-card">
      <p class="eyebrow">CARBONLAB ACCOUNT</p>
      <div class="auth-tabs" role="tablist" aria-label="Account access">
        <button class="auth-tab active" type="button" data-auth-tab="login">Sign in</button>
        <button class="auth-tab" type="button" data-auth-tab="register">Sign up</button>
      </div>
      <section id="login-pane" class="auth-pane">
        <h1>Welcome back</h1><p class="muted">Sign in to continue.</p>
        <form id="login-form" class="form-stack">
          <label>Username<input name="username" autocomplete="username" required></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
          <button class="button-primary" type="submit">Sign in <span>→</span></button>
        </form>
        <p id="login-status" class="form-status" role="status"></p>
      </section>
      <section id="register-pane" class="auth-pane" hidden>
        <h1>Create account</h1><p class="muted">New registrations receive standard user access.</p>
        <form id="register-form" class="form-stack">
          <label>Username<input name="username" autocomplete="username" minlength="3" maxlength="40" required></label>
          <label>Password <small>At least 10 characters</small><input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
          <button class="button-primary" type="submit">Create account <span>→</span></button>
        </form>
        <p id="register-status" class="form-status" role="status"></p>
      </section>
    </section>
    <p class="auth-footnote">CO₂ ADSORPTION PREDICTION PLATFORM</p>
  </main>
  <script src="js/auth.js?v=carbonlab-final-20261103"></script>
  <script>
    document.querySelectorAll('[data-auth-tab]').forEach((button) => button.addEventListener('click', () => {
      document.querySelectorAll('[data-auth-tab]').forEach((tab) => tab.classList.toggle('active', tab === button));
      document.getElementById('login-pane').hidden = button.dataset.authTab !== 'login';
      document.getElementById('register-pane').hidden = button.dataset.authTab !== 'register';
    }));
  </script>
</body>
</html>
